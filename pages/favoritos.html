<main class="favorites-content">

    <div class="container">

        <div class="favorites-counter">

            <div>

                <h2>Meus animais favoritos</h2>

                <span id="counterText"></span>

            </div>

            <a
                href="animais.html"
                class="btn btn-primary"
            >
                <i class="bi bi-search"></i>
                Encontrar animais
            </a>

        </div>


        <div
            class="row g-4"
            id="favoritesList"
        ></div>


        <div
            id="emptyFavorites"
            class="empty-favorites"
            style="display: none;"
        >

            <div class="empty-icon">

                <i class="bi bi-heart"></i>

            </div>

            <h2>
                Você ainda não tem favoritos
            </h2>

            <p>
                Clique no coração de um animal para
                adicioná-lo aos seus favoritos.
            </p>

            <a
                href="animais.html"
                class="btn btn-primary"
            >
                Ver animais
            </a>

        </div>

    </div>

</main>
<script src="../js/script.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const lista =
        document.getElementById("favoritesList");

    const vazio =
        document.getElementById("emptyFavorites");

    const contador =
        document.getElementById("counterText");


    let favoritos = JSON.parse(
        localStorage.getItem("sosPatinhasFavoritos")
    ) || [];


    const animais = {

        "Thor": {
            nome: "Thor",
            sexo: "Macho",
            porte: "Médio",
            cidade: "Patos de Minas - MG"
        },

        "Luna": {
            nome: "Luna",
            sexo: "Fêmea",
            porte: "Pequeno",
            cidade: "Patos de Minas - MG"
        },

        "Max": {
            nome: "Max",
            sexo: "Macho",
            porte: "Grande",
            cidade: "Patos de Minas - MG"
        }

    };


    function carregarFavoritos() {

        lista.innerHTML = "";


        if (favoritos.length === 0) {

            vazio.style.display = "block";

            contador.textContent =
                "Nenhum animal favoritado.";

            return;

        }


        vazio.style.display = "none";


        contador.textContent =
            favoritos.length === 1
                ? "1 animal favoritado."
                : `${favoritos.length} animais favoritados.`;


        favoritos.forEach(function (nome) {

            const animal = animais[nome];


            if (!animal) {
                return;
            }


            const coluna =
                document.createElement("div");


            coluna.className =
                "col-md-6 col-lg-4";


            coluna.innerHTML = `

                <div class="favorite-card">

                    <div class="favorite-photo">

                        <i class="bi bi-image photo-icon"></i>

                        <button
                            class="remove-favorite"
                            data-animal="${animal.nome}"
                        >

                            <i class="bi bi-heart-fill"></i>

                        </button>

                    </div>


                    <div class="favorite-info">

                        <h3>
                            ${animal.nome}
                        </h3>

                        <p>
                            <i class="bi bi-gender-ambiguous"></i>
                            ${animal.sexo}
                        </p>

                        <p>
                            <i class="bi bi-rulers"></i>
                            Porte ${animal.porte}
                        </p>

                        <p>
                            <i class="bi bi-geo-alt"></i>
                            ${animal.cidade}
                        </p>

                        <a
                            href="#"
                            class="btn btn-primary w-100"
                        >
                            Ver detalhes
                        </a>

                    </div>

                </div>

            `;


            lista.appendChild(coluna);

        });


        document.querySelectorAll(
            ".remove-favorite"
        ).forEach(function (botao) {

            botao.addEventListener(
                "click",
                function () {

                    const nome =
                        this.dataset.animal;


                    favoritos =
                        favoritos.filter(function (item) {

                            return item !== nome;

                        });


                    localStorage.setItem(
                        "sosPatinhasFavoritos",
                        JSON.stringify(favoritos)
                    );


                    carregarFavoritos();

                }
            );

        });

    }


    carregarFavoritos();

});

</script>
